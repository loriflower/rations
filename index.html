<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Rations in the World</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --verde-mimetico: #4b5320;
            --sabbia: #fefae0;
            --terra: #dda15e;
            --scuro: #1b1e0f;
            --transizione: 0.4s ease-out;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background: var(--scuro);
            color: white;
            overflow-x: hidden;
        }

        .bg-camouflage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--verde-mimetico);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(96, 108, 56, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 10%, rgba(40, 54, 24, 0.5) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(188, 108, 37, 0.2) 0%, transparent 50%);
            z-index: -1;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 40px 15px;
            box-sizing: border-box;
            animation: slideUp var(--transizione);
        }

        .page.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 50px; }
        header h1 { 
            font-family: 'Black Ops One', cursive; 
            font-size: 3.5rem; 
            color: var(--sabbia); 
            margin: 0; 
            text-transform: uppercase;
            line-height: 1.1;
        }
        header p { 
            letter-spacing: 1px; 
            color: var(--terra); 
            font-weight: bold; 
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .content-box {
            background: rgba(255,255,255,0.95);
            color: #222;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(0,0,0,0.7);
            border: 2px solid var(--terra);
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transizione);
        }

        .card:hover { background: var(--terra); color: var(--scuro); transform: scale(1.03); }
        .card i { font-size: 3rem; margin-bottom: 15px; }
        .card span { font-family: 'Black Ops One', cursive; font-size: 1.4rem; display: block; }
